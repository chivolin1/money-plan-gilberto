<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Money Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E$%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f6f6;--card:#fff;--ink:#14212b;--muted:#5b6b78;--line:#dfe6ea;
  --pri:#0f766e;--pri-ink:#fff;--pri-soft:#d9f1ee;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --blue:#2563eb;--radius:16px;--shadow:0 1px 2px rgba(15,30,40,.06),0 4px 14px rgba(15,30,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1418;--card:#142027;--ink:#e8f0f3;--muted:#93a4af;--line:#25353e;--pri:#2dd4bf;--pri-ink:#042f2a;--pri-soft:#12403c;
  --ok:#4ade80;--ok-soft:#10361f;--warn:#fbbf24;--warn-soft:#3b2d0a;--bad:#f87171;--bad-soft:#401414;--blue:#60a5fa;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.25rem;margin:22px 0 10px}
h3{font-size:1.05rem}
.topbar{background:var(--pri);color:var(--pri-ink);padding:12px 16px 10px;position:sticky;top:0;z-index:20;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;gap:12px;align-items:center;max-width:980px;margin:0 auto}
.brand h1{font-size:1.35rem}.brand p{margin:0;font-size:.85rem;opacity:.85}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 9px;min-height:62px;font:inherit;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button .ico{font-size:1.4rem;line-height:1}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs button.on .ico{transform:scale(1.1)}
.view{max-width:980px;margin:0 auto;padding:6px 14px 20px}
.foot{max-width:980px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:.8rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0;border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:16px}.stat .lbl{color:var(--muted);font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .big{font-size:2rem;font-weight:800;margin:4px 0}.stat .sub{color:var(--muted);font-size:.85rem}
.pos{color:var(--ok)}.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
.monthbar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.monthbar input[type=month]{flex:1;min-width:150px}
button,.btn{font:inherit;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:active,.btn:active{transform:scale(.98)}
button.pri,.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{min-height:44px;padding:0 14px;font-size:.92rem}
button.ghost{background:none;border-color:transparent;color:var(--pri)}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--pri);flex:none}
input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent);outline-offset:1px}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 12px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--pri-soft);color:var(--pri);vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.ex{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alert.info{background:var(--pri-soft);border-color:var(--pri);color:var(--ink)}
.alert b{color:inherit}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}.item .t{font-weight:700;overflow-wrap:anywhere}.item .s{color:var(--muted);font-size:.85rem}
.item .amt{font-weight:800;white-space:nowrap}
.item.paid .t,.item.paid .amt{text-decoration:line-through;opacity:.55}
.item.click{cursor:pointer}
.datebox{width:52px;text-align:center;background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:4px 0;flex:none}
.datebox b{display:block;font-size:1.25rem;line-height:1.1}.datebox span{font-size:.7rem;text-transform:uppercase;font-weight:700}
.datebox.od{background:var(--bad-soft);color:var(--bad)}.datebox.pd{background:var(--ok-soft);color:var(--ok)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;min-height:46px}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.catrow{margin:10px 0}.catrow .row{margin-bottom:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
svg.chart .val{fill:var(--ink);font-weight:700}
table.bd{width:100%;border-collapse:collapse;font-size:.92rem}
table.bd td{padding:5px 0;border-bottom:1px dashed var(--line)}table.bd td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.bd tr.tot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line);padding-top:8px}
details summary{cursor:pointer;color:var(--pri);font-weight:600;min-height:40px;display:flex;align-items:center}
.modal-wrap{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal-wrap[hidden],.toast[hidden]{display:none}
.modal{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:22px}}
.modal .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.modal .actions .pri{flex:1}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111c22;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.remrow{display:flex;gap:8px;align-items:flex-end;margin:6px 0}.remrow>div{flex:1}
code.k{background:var(--pri-soft);padding:1px 6px;border-radius:6px;font-size:.85em}
ol.steps{padding-left:22px;margin:6px 0}ol.steps li{margin:6px 0}
@media(min-width:820px){
  body{padding-bottom:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 24px}
  .brand{margin:0;max-width:none}
  .tabs{position:static;background:none;border:0;box-shadow:none;padding:0;width:auto}
  .tabs button{min-height:52px;flex-direction:row;gap:6px;padding:0 16px;color:var(--pri-ink);opacity:.8;font-size:.95rem;border-radius:12px}
  .tabs button.on{background:rgba(255,255,255,.2);color:var(--pri-ink);opacity:1}
  .toast{bottom:30px}
}
.alert a,.card a{color:inherit;font-weight:700;text-decoration:underline}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">$</span><div><h1>Money Plan</h1><p id="subtitle">Bills, paychecks &amp; household budget</p></div></div>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
</header>
<main id="view" class="view" aria-live="polite"></main>
<footer class="foot">Tax figures are <strong>estimates only</strong>, not tax advice. Check your pay stub / W-4 or ask a tax professional. Data stays on this device (browser localStorage).</footer>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* Money Plan — plain JS, no dependencies. Data lives in localStorage. */
(function () {
'use strict';

/* ---------- helpers ---------- */
var KEY = 'moneyplan.v1';
var CATS = ['Housing', 'Utilities', 'Insurance', 'Subscriptions', 'Debt / Credit card', 'Transportation', 'Food', 'Medical', 'Other'];
var CAT_COLORS = ['#0f766e', '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#ca8a04', '#16a34a', '#0891b2', '#64748b'];
var $ = function (s, r) { return (r || document).querySelector(s); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var fmtMoney = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
var money = function (n) { n = Number(n) || 0; return (n < 0 ? '-' : '') + fmtMoney.format(Math.abs(n)); };
var num = function (v) { var n = parseFloat(v); return isFinite(n) ? n : 0; };
var round2 = function (n) { return Math.round(n * 100) / 100; };
var uid = function () { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var parseD = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
var today = function () { return ymd(new Date()); };
var thisMonth = function () { return today().slice(0, 7); };
var dim = function (y, m) { return new Date(y, m, 0).getDate(); };
var addMonths = function (mk, n) { var p = mk.split('-').map(Number); return ymd(new Date(p[0], p[1] - 1 + n, 1)).slice(0, 7); };
var addDays = function (s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
var diffDays = function (a, b) { return Math.round((parseD(a) - parseD(b)) / 86400000); };
var monthDate = function (mk, day) { var p = mk.split('-').map(Number); return mk + '-' + pad(Math.min(Math.max(1, day), dim(p[0], p[1]))); };
var monthName = function (mk) { var p = mk.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
var monthShort = function (mk) { var p = mk.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-US', { month: 'short' }); };
var dayLabel = function (s) { return parseD(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
var timeLabel = function (t) { var p = (t || '09:00').split(':').map(Number); var h = p[0] % 12 || 12; return h + ':' + pad(p[1] || 0) + ' ' + (p[0] < 12 ? 'AM' : 'PM'); };
var ordinal = function (n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

/* ---------- default / example data ---------- */
function exampleState() {
  return {
    version: 1,
    settings: {
      userName: 'Gilberto',
      ssPct: 6.2, medicarePct: 1.45, statePct: 0,
      reminders: [{ days: 3, time: '09:00' }, { days: 1, time: '09:00' }],
      timedEvents: false, icsMonths: 12, notify: false
    },
    bills: [
      { id: 'ex_renters', name: 'Renters insurance', amount: 24.25, category: 'Insurance', recurrence: 'monthly', dueDay: 27, dueDate: '', startMonth: '2026-10', notes: 'EXAMPLE from your calendar — edit freely.', reminders: null, active: true, example: true },
      { id: 'ex_flex', name: 'Flex rent', amount: 515, category: 'Housing', recurrence: 'monthly', dueDay: 16, dueDate: '', startMonth: '2026-10', notes: 'EXAMPLE from your calendar — edit freely.', reminders: null, active: true, example: true }
    ],
    paid: {},
    actuals: {},
    notified: {},
    income: {
      g: {
        enabled: true, supplementalPct: 22, fedRegPct: 5,
        entries: [
          { id: 'ex_pay', kind: 'paycheck', label: 'Paycheck (example)', date: '2026-10-03', salary: 1100, bonus: 4100, otherDed: 0, amount: 0, repeat: 'none', example: true },
          { id: 'ex_dep', kind: 'deposit', label: 'Take-home deposit on the 1st (example)', date: '2026-10-01', salary: 0, bonus: 0, otherDed: 0, amount: 1100, repeat: 'monthly', example: true }
        ]
      },
      w: {
        enabled: true, rate: 18, hours: 40, overtime: true, otThreshold: 40, otMult: 1.5,
        frequency: 'biweekly', anchor: '2026-10-16', semiDay1: 15, semiDay2: 0,
        preTax: 0, otherDed: 0, fedMode: 'percent', fedPct: 8, filing: 'married', example: true
      }
    }
  };
}

function fill(base, over) {
  if (over == null) return base;
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return over;
  var out = {}, k;
  for (k in base) out[k] = (k in over) ? fill(base[k], over[k]) : clone(base[k]);
  for (k in over) if (!(k in out)) out[k] = over[k];
  return out;
}

var memStore = null;
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* ignore */ }
  return exampleState();
}
function normalize(s) {
  var d = exampleState();
  var st = fill(d, s);
  ['bills'].forEach(function (k) { if (!Array.isArray(st[k])) st[k] = d[k]; });
  if (!Array.isArray(st.income.g.entries)) st.income.g.entries = [];
  if (!Array.isArray(st.settings.reminders)) st.settings.reminders = d.settings.reminders;
  return st;
}

var state = load();
var ui = { tab: 'dashboard', month: thisMonth(), inc: 'g' };
var icsInfo = { url: null, count: 0, at: null };
var icsTimer = null;

function save(skipIcs) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { memStore = JSON.stringify(state); }
  if (!skipIcs) scheduleIcs();
}

/* ---------- bills ---------- */
function occurrencesFor(b, mk) {
  if (b.active === false) return [];
  var date;
  if (b.recurrence === 'once') {
    if (!b.dueDate || b.dueDate.slice(0, 7) !== mk) return [];
    date = b.dueDate;
  } else {
    if (b.startMonth && mk < b.startMonth) return [];
    if (b.endMonth && mk > b.endMonth) return [];
    date = monthDate(mk, num(b.dueDay) || 1);
  }
  var key = b.id + '|' + mk;
  return [{ bill: b, date: date, mk: mk, key: key, amount: num(b.amount), paid: state.paid[key] || null }];
}
function billsInMonth(mk) {
  var out = [];
  state.bills.forEach(function (b) { out = out.concat(occurrencesFor(b, mk)); });
  return out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.bill.name.localeCompare(b.bill.name); });
}
function overdueList() {
  var t = today(), out = [], cm = thisMonth();
  for (var i = -5; i <= 0; i++) {
    billsInMonth(addMonths(cm, i)).forEach(function (o) { if (!o.paid && o.date < t) out.push(o); });
  }
  return out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function upcomingList(days) {
  var t = today(), end = addDays(t, days), out = [], cm = thisMonth();
  for (var i = 0; i <= 3; i++) {
    billsInMonth(addMonths(cm, i)).forEach(function (o) { if (!o.paid && o.date >= t && o.date <= end) out.push(o); });
  }
  return out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function billReminders(b) { return (b.reminders && b.reminders.length) ? b.reminders : state.settings.reminders; }
function fireAt(date, r) { var p = (r.time || '09:00').split(':').map(Number); var d = parseD(addDays(date, -num(r.days))); d.setHours(p[0] || 0, p[1] || 0, 0, 0); return d; }
function remLabel(r) { return (num(r.days) === 0 ? 'On the due date' : num(r.days) + (num(r.days) === 1 ? ' day' : ' days') + ' before') + ' at ' + timeLabel(r.time); }

/* ---------- income calc ---------- */
function gCalc(e) {
  var g = state.income.g, s = state.settings;
  if (e.kind === 'deposit') return { gross: 0, fed: 0, ss: 0, med: 0, st: 0, other: 0, est: round2(num(e.amount)), deposit: true };
  var salary = num(e.salary), bonus = num(e.bonus), gross = salary + bonus;
  var fedReg = salary * num(g.fedRegPct) / 100, fedBonus = bonus * num(g.supplementalPct) / 100;
  var ss = gross * num(s.ssPct) / 100, med = gross * num(s.medicarePct) / 100, st = gross * num(s.statePct) / 100;
  var other = num(e.otherDed);
  var est = Math.max(0, gross - fedReg - fedBonus - ss - med - st - other);
  return { gross: gross, salary: salary, bonus: bonus, fedReg: fedReg, fedBonus: fedBonus, fed: fedReg + fedBonus, ss: ss, med: med, st: st, other: other, est: round2(est), deposit: false };
}
function gOccurrences(mk) {
  var out = [];
  if (!state.income.g.enabled) return out;
  state.income.g.entries.forEach(function (e) {
    if (!e.date) return;
    var date = null, em = e.date.slice(0, 7);
    if (em === mk) date = e.date;
    else if (e.repeat === 'monthly' && mk > em) date = monthDate(mk, +e.date.slice(8, 10));
    if (!date) return;
    var c = gCalc(e), key = 'g|' + e.id + '|' + date;
    var actual = c.deposit ? c.est : (state.actuals[key] != null ? state.actuals[key] : null);
    out.push({ who: 'g', entry: e, date: date, key: key, calc: c, est: c.est, actual: actual, label: e.label || (c.deposit ? 'Deposit' : 'Paycheck') });
  });
  return out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
var BRACKETS = {
  married: { std: 32200, b: [[24800, 0.10], [100800, 0.12], [211400, 0.22], [403550, 0.24]] },
  single: { std: 16100, b: [[12400, 0.10], [50400, 0.12], [105700, 0.22], [201775, 0.24]] }
};
function fedAnnual(taxable, filing) {
  var c = BRACKETS[filing] || BRACKETS.married, inc = Math.max(0, taxable - c.std), tax = 0, prev = 0;
  for (var i = 0; i < c.b.length; i++) {
    if (inc > prev) { tax += (Math.min(inc, c.b[i][0]) - prev) * c.b[i][1]; prev = c.b[i][0]; }
  }
  if (inc > prev) tax += (inc - prev) * 0.32;
  return tax;
}
function wPeriods(w) { return w.frequency === 'weekly' ? 52 : w.frequency === 'biweekly' ? 26 : 24; }
function wCalc() {
  var w = state.income.w, s = state.settings;
  var h = num(w.hours), rate = num(w.rate), thr = num(w.otThreshold) || 40, mult = num(w.otMult) || 1.5;
  var regH = Math.min(h, thr), otH = Math.max(0, h - thr);
  var weekly = rate * regH + rate * otH * (w.overtime ? mult : 1);
  var per = wPeriods(w), gross = weekly * 52 / per;
  var preTax = num(w.preTax), taxable = Math.max(0, gross - preTax);

/* ---------- calendar (.ics) ---------- */

  var L = [], now = stamp(new Date()), n = 0, t = today();
  L.push('BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Money Plan//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Money Plan', 'X-WR-TIMEZONE:America/Chicago',
    'BEGIN:VTIMEZONE', 'TZID:America/Chicago',
    'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0600', 'TZOFFSETTO:-0500', 'TZNAME:CDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0600', 'TZNAME:CST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD',
    'END:VTIMEZONE');
  var months = Math.max(1, Math.min(36, num(state.settings.icsMonths) || 12)), cm = thisMonth();
  for (var i = 0; i < months; i++) {

      var rems = billReminders(b);

      L.push('BEGIN:VEVENT', 'UID:moneyplan-' + b.id + '-' + o.mk + '@moneyplan.local', 'DTSTAMP:' + now,
        'DTSTART;VALUE=DATE:' + d8, 'DTEND;VALUE=DATE:' + nx, 'SUMMARY:' + icsEsc(title),

        'CATEGORIES:Money Plan', 'TRANSP:TRANSPARENT');

            'DTSTART;TZID=America/Chicago:' + st, 'DTEND;TZID=America/Chicago:' + et,
            'SUMMARY:' + icsEsc('⏰ ' + b.name + ' ' + money(o.amount) + ' due ' + dayLabel(o.date)), 'DESCRIPTION:' + icsEsc('Reminder from Money Plan'),

/* ---------- charts (SVG) ---------- */

  groups.forEach(function (g, gi) {

    onSave: function (d) {
      if (d.kind === 'deposit' && (d.amount === '' || num(d.amount) < 0)) return 'Enter the deposit amount.';
      if (!d.date) return 'Pick a date.';
      var rec = { id: d.id || uid(), kind: d.kind, label: String(d.label).trim(), date: d.date, salary: num(d.salary), bonus: num(d.bonus), otherDed: num(d.otherDed), amount: num(d.amount), repeat: d.repeat, example: false };
      var L = state.income.g.entries;
      if (d.id) { L[L.findIndex(function (e) { return e.id === d.id; })] = rec; } else L.push(rec);
      save(); render(); toast('Saved'); return true;
    },
    onDelete: d.id ? function () {
      if (!confirm('Delete this entry?')) return false;
      state.income.g.entries = state.income.g.entries.filter(function (e) { return e.id !== d.id; });
      save(); render(); return true;
    } : null
  });
}
function updatePreview() {
  var f = $('#modal form'), p = $('#prev'); if (!f || !p || !modalCfg) return;
  var d = { kind: 'paycheck', salary: fv(f, 'salary'), bonus: fv(f, 'bonus'), otherDed: fv(f, 'otherDed') };
  var c = gCalc(d);
  p.innerHTML = '<b>Estimated take-home: ' + money(c.est) + '</b><div class="small muted">Gross ' + money(c.gross) + ' − federal ' + money(c.fed) + ' − SS ' + money(c.ss) + ' − Medicare ' + money(c.med) + (c.other ? ' − other ' + money(c.other) : '') + '. Estimate only.</div>';
}

/* ---------- Backup ---------- */
function exportJson() {
  var name = 'money-plan-backup-' + today() + '.json';
  downloadBlob(name, JSON.stringify({ app: 'money-plan', exportedAt: new Date().toISOString(), data: state }, null, 2), 'application/json');
  toast('Backup downloaded');
}
function importJson(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var j = JSON.parse(r.result), data = j && j.data ? j.data : j;
      if (!data || !Array.isArray(data.bills) || !data.income) throw new Error('bad');
      if (!confirm('Replace ALL current data with this backup?')) return;
      state = normalize(data); save(); render(); toast('Backup restored');
    } catch (e) { alert('That file is not a valid Money Plan backup.'); }
  };
  r.readAsText(file);
}

/* ---------- Events ---------- */
document.addEventListener('click', function (ev) {
  var m = ev.target.closest('[data-maction]');
  if (m && modalCfg) {
    var a = m.getAttribute('data-maction');
    if (a === 'close') { closeModal(); return; }
    if (a === 'delete') { if (modalCfg.onDelete() === true) closeModal(); return; }
    syncModal();
    if (a === 'add-rem') modalCfg.extra.addRem(modalCfg.draft);
    if (a === 'del-rem') modalCfg.extra.delRem(modalCfg.draft, +m.getAttribute('data-i'));
    drawModal(); return;
  }
  if (ev.target === $('#modal')) { closeModal(); return; }
  var el = ev.target.closest('[data-action]');
  if (!el) return;
  var act = el.getAttribute('data-action'), id = el.getAttribute('data-id');
  if (act === 'ics') { ev.preventDefault(); downloadIcs(); return; }
  if (el.tagName === 'A') ev.preventDefault();
  switch (act) {
    case 'tab': ui.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0, 0); break;
    case 'month': ui.month = addMonths(ui.month, +el.getAttribute('data-d')); render(); break;
    case 'month-now': ui.month = thisMonth(); render(); break;
    case 'inc-tab': ui.inc = el.getAttribute('data-t'); render(); break;
    case 'add-bill': billModal(null); break;
    case 'edit-bill': billModal(id); break;
    case 'add-entry': entryModal(null); break;
    case 'edit-entry': entryModal(id); break;
    case 'toggle-paid':
      var k = el.getAttribute('data-key');
      if (state.paid[k]) { delete state.paid[k]; toast('Marked unpaid'); } else { state.paid[k] = { paidOn: today(), amount: num(el.getAttribute('data-amt')) }; toast('Marked paid ✓'); }
      save(); render(); break;
    case 'clear-actual': delete state.actuals[el.getAttribute('data-key')]; save(); render(); break;
    case 'add-rem': state.settings.reminders.push({ days: 1, time: '09:00' }); save(); render(); break;
    case 'del-rem': state.settings.reminders.splice(+el.getAttribute('data-i'), 1); save(); render(); break;
    case 'export': exportJson(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset-example': if (confirm('Replace everything with the example data?')) { state = exampleState(); save(); render(); toast('Example data restored'); } break;
    case 'wipe': if (confirm('Delete ALL data? This cannot be undone (export a backup first).')) { var e0 = exampleState(); state = fill(e0, { bills: [], income: { g: { entries: [] } }, paid: {}, actuals: {} }); state.bills = []; state.income.g.entries = []; state.income.w.example = false; save(); render(); toast('All data deleted'); } break;
  }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'importFile') { if (t.files[0]) importJson(t.files[0]); t.value = ''; return; }
  if (modalCfg && t.closest('#modal')) { if (t.hasAttribute('data-rerender')) { syncModal(); drawModal(); } return; }
  if (t.hasAttribute('data-month')) { if (/^\d{4}-\d{2}$/.test(t.value)) { ui.month = t.value; render(); } return; }
  if (t.hasAttribute('data-actual')) {
    var key = t.getAttribute('data-actual');
    if (t.value === '') delete state.actuals[key]; else state.actuals[key] = round2(num(t.value));
    save(); render(); return;
  }
  if (t.hasAttribute('data-bind')) {
    var path = t.getAttribute('data-bind'), type = t.getAttribute('data-type'), v;
    v = type === 'checkbox' ? t.checked : type === 'number' ? (t.value === '' ? 0 : num(t.value)) : t.value;
    setPath(state, path, v); save();
    if (path === 'settings.notify' && v && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    render();
  }
});
document.addEventListener('input', function (ev) { if (ev.target.hasAttribute && ev.target.hasAttribute('data-live') && modalCfg) updatePreview(); });
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (!modalCfg) return;
  syncModal();
  var r = modalCfg.onSave(modalCfg.draft);
  if (r === true) closeModal(); else $('#merr').textContent = r || '';
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && modalCfg) closeModal(); });

/* ---------- Browser notifications (only while app is open) ---------- */
function checkNotifications() {
  if (!state.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  var now = new Date(), changed = false;
  upcomingList(45).forEach(function (o) {
    billReminders(o.bill).forEach(function (r) {
      var f = fireAt(o.date, r), k = o.key + '|' + r.days + '|' + r.time;
      if (f <= now && now - f < 36 * 3600000 && !state.notified[k]) {
        try { new Notification('Money Plan: ' + o.bill.name + ' ' + money(o.amount), { body: 'Due ' + dayLabel(o.date) }); } catch (e) { /* ignore */ }
        state.notified[k] = Date.now(); changed = true;
      }
    });
  });
  if (changed) save(true);
}

/* ---------- Start ---------- */
var hashTab = (location.hash || '').replace('#', '').split('/')[0];
if (TABS.some(function (t) { return t[0] === hashTab; })) ui.tab = hashTab;
if (/^(g|w)$/.test((location.hash.split('/')[1] || ''))) ui.inc = location.hash.split('/')[1];
render();
refreshIcs();
setInterval(checkNotifications, 60000);
setTimeout(checkNotifications, 2000);
window.__moneyplan = { state: function () { return state; }, buildIcs: buildIcs, wCalc: wCalc, gCalc: gCalc, summary: summary, wPaydays: wPaydays, ui: ui, render: render };
})();

</script>
</body>
